stage_checklist:
  种子:
    - 公司章程/股权结构表
    - 核心团队简历与分工
    - MVP或原型说明
  天使:
    - 近6个月财务流水与审计/报表（如有）
    - 核心技术说明与知识产权清单
    - 关键客户/合作意向证明
  A轮:
    - 最近一年财务报表与纳税证明
    - 产品/项目验收材料（如有）
    - 高新/专精特新资质证明（如有）
  成长期:
    - 重大项目合同与交付证明
    - 人员社保/用工合规材料
    - 供应链与产能说明
  成熟期:
    - 年度审计报告
    - 合规体系文件（内控、信息安全等）
    - 产业带动与就业贡献说明
